<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Oracle</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Body Oracle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one phone-width column; content scrolls between a header and a fixed six-slot bar with a raised + */
:root{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#1f1f22; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --fg:#f2f2f3; --muted:#8e8e93; --faint:#5c5c61; --accent:#f2f2f3; --accent-ink:#0b0b0c; --danger:#ff8a7a;
  --fig-a:rgba(255,255,255,.13); --fig-b:rgba(255,255,255,.04);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --r-img:14px; --r-card:16px; --card-bg:var(--surface); --card-bd:var(--line);
  color-scheme:dark;
}
:root[data-corners="round"]{--r-img:22px;--r-card:22px}
:root[data-corners="square"]{--r-img:3px;--r-card:6px}
:root[data-cards="outline"]{--card-bg:transparent;--card-bd:var(--line-2)}

[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{margin:0;font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.ic{flex:none;display:block}

#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 36px}
#main.quiet{background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.06),transparent 70%),var(--bg)}

/* bottom bar */
#nav{display:grid;grid-template-columns:repeat(6,1fr);align-items:end;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);border-top:1px solid var(--line);background:var(--bg)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--faint);font-size:10px;letter-spacing:.02em;padding:4px 0}
.nb.on{color:var(--fg)}
.nb.plus{align-self:center}
.nb.plus .pc{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:transform .2s}
.nb.plus:active .pc{transform:scale(.94)}

/* headers */
.hd{display:flex;align-items:center;gap:6px;min-height:50px;margin-bottom:14px}
.hd-main{flex:1;min-width:0}
.t-title{flex:1;min-width:0;margin:0;font:700 30px/1.1 var(--body);letter-spacing:-.022em;text-wrap:balance}
.hd-r{display:flex;gap:2px;margin-left:auto}
.brand{margin:0;font:600 13px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase}
.sub{margin:6px 0 0;color:var(--fg);font:700 26px/1.15 var(--body);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.moon svg{display:block}
.ed-hd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;min-height:50px;margin:0 -8px 12px}
.ed-t{text-align:center;font-weight:600;font-size:16px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:var(--fg);flex:none}
.ibtn.ring{border:1px solid var(--line-2)}
.ibtn.sm{width:30px;height:30px}
.tbtn{background:none;border:0;color:var(--muted);font-size:15px;padding:8px 10px}
.tbtn.strong{color:var(--fg);font-weight:600}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
.center{display:flex;justify-content:center;margin-top:18px}

/* sections */
.stack{display:flex;flex-direction:column;gap:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-t{margin:0;font:600 12px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sub-h{margin:26px 0 6px;font:600 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}
.empty-cta{width:100%;text-align:left;background:var(--card-bg);border:1px dashed var(--line-2);border-radius:var(--r-card);padding:18px;color:var(--muted)}
.mt{margin-top:16px}
.lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 9px}

/* cards & lists */
.card{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:var(--r-card)}
.list{display:flex;flex-direction:column;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;text-align:left;background:none;border:0;color:var(--fg);box-sizing:border-box}
.row-i{color:var(--muted);display:grid}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-t{font-size:15px}
.row-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-v{color:var(--muted);font-size:14px;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic:last-child{color:var(--faint)}
.row.add{color:var(--muted);gap:10px}
.btn-plain{background:none;border:0;padding:0;text-align:left;color:var(--fg);font-size:15px}
.thumb{width:56px;height:56px;border-radius:calc(var(--r-img) * .75);overflow:hidden;flex:none;background:var(--surface-2);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb i{color:var(--c);display:grid}
.inl{background:none;border:0;color:var(--muted);text-align:right;min-width:0;width:50%;font-size:14px;padding:4px 0}
.inl:focus{outline:none;color:var(--fg)}
.dt{background:none;border:0;color:var(--muted);font-size:14px;min-width:0;max-width:60%;text-align:right}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.sm .chip{height:26px;font-size:12px;padding:0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font-size:13.5px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.dashed{border-style:dashed;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;display:inline-block}
.dot.lg{width:14px;height:14px}
.chip.on .dot{box-shadow:0 0 0 1.5px var(--accent-ink)}

/* segmented */
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{flex:1;height:32px;border-radius:999px;border:0;background:none;color:var(--muted);font-size:13px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}

/* image slots */
.slot{position:relative;display:block;width:100%;max-width:100%;padding:0;border:1px dashed var(--line-2);background:var(--surface);border-radius:var(--r-img);overflow:hidden;color:var(--muted)}
.slot.has{border:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot-plus{position:absolute;inset:0;display:grid;place-items:center}
.slot-plus i{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--fg)}

/* home */
.hero{position:relative}
.hero .slot{aspect-ratio:4/3}
.hero-q{position:absolute;left:0;right:0;bottom:0;text-align:left;background:none;border:0;padding:18px 18px 16px;font:600 20px/1.25 var(--body);letter-spacing:-.01em;color:var(--fg);text-wrap:balance}
.hero-q.on-img{background:linear-gradient(transparent,rgba(0,0,0,.7));border-radius:0 0 var(--r-img) var(--r-img);color:#fff}
.hero-q.ph{color:var(--muted)}
.mod-int{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.mi-t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.mi-name{margin:4px 0 0;font:600 18px/1.25 var(--body);letter-spacing:-.01em}
.mi-name.ph{color:var(--muted);background:none;border:0;padding:0}
.mi-img{width:72px;flex:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wtile{flex:none;width:104px;background:none;border:0;padding:0;color:var(--fg);text-align:left;display:flex;flex-direction:column;gap:7px}
.wimg{width:104px;height:104px;border-radius:var(--r-img);overflow:hidden;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 38%,transparent),var(--surface) 75%);display:grid;place-items:center;color:var(--c)}
.wimg img{width:100%;height:100%;object-fit:cover}
.wname{font-size:13px}
.rcard-h{flex:none;width:150px}

/* tiles */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tw{min-width:0}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:var(--r-img);overflow:hidden;background:var(--surface);border:0;padding:0;color:var(--fg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-t{position:absolute;inset:0;padding:10px 10px 26px;text-align:left;font:500 13px/1.3 var(--body);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.tile-k{position:absolute;left:10px;bottom:9px;color:var(--c)}
.tile-s{position:absolute;left:10px;right:10px;bottom:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left}
.tile.add{border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--muted)}
.tile.sig{background:var(--surface-2)}
.tile.sig img{object-fit:contain;padding:12%;box-sizing:border-box}
.cap{margin:5px 0 0;font-size:12px;color:var(--muted)}

.home-hd{align-items:flex-start;margin-bottom:22px}
.chips.scroll.flush{margin-bottom:0}
.add-big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:var(--r-card);border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:15px;font-weight:500}
.add-big:active{background:var(--surface-2)}

/* map */
.mon{margin:26px 0 2px;font:700 22px var(--body);letter-spacing:-.02em}
.mon:first-child{margin-top:0}
.day{padding:14px 0 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.day-t{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lines{display:flex;flex-direction:column}
.line{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:9px 0;color:var(--fg);text-align:left}
.line-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-k{font-size:11px;color:var(--faint);text-transform:lowercase}
.line time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h2{margin:0;font:600 17px var(--body)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding-bottom:6px}
.cd{background:none;border:0;color:var(--fg);padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-size:14px}
.cd .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.cd.today .n{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cd.sel .n{box-shadow:0 0 0 1.5px var(--accent)}
.cd.out{opacity:.28}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal-day{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.cal-day .sec-h{align-items:center}

/* entry */
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.car-i{flex:0 0 86%;scroll-snap-align:center}
.car-i.solo{flex-basis:100%}
.entry-text{font:400 19px/1.45 var(--body);letter-spacing:-.01em;margin:10px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.actions{display:flex;gap:10px;margin-top:22px}
.danger-link{display:block;margin:28px auto 0;background:none;border:0;color:var(--danger);font-size:14px;padding:10px}
.ed-photo .slot{aspect-ratio:4/3}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.kind-pill{display:inline-flex;align-items:center;gap:6px;margin:14px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;height:32px;padding:0 12px;color:var(--fg);font-size:13px}
.field{display:block;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:13px 14px;font-size:16px}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--line-2)}
.area{min-height:118px;resize:vertical;line-height:1.45}
.area.sm{min-height:76px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;border:0}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn[disabled]{opacity:.5}
.stepper{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:8px;align-items:center}
.step .n{width:22px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;flex:none}
.step .field{padding:11px 12px;font-size:15px}
.step.done .field{text-decoration:line-through;color:var(--muted)}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.ck.on{background:var(--accent);border-color:var(--accent)}
.addl{background:none;border:0;color:var(--muted);padding:8px 0;font-size:14px;display:flex;gap:8px;align-items:center}

/* editors */
.ce-top{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:end}
.ce-top .lbl{margin-top:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.sw.custom{background:conic-gradient(#d98a7a,#d8c08f,#a9bfa0,#8fa7c4,#b49ccc,#d98a7a);display:block;overflow:hidden}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icb{height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center}
.icb.on{border-color:var(--accent);color:var(--fg)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.boxbtn{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;color:var(--fg);text-align:left}
.boxbtn .box{aspect-ratio:1;border:1px dashed var(--line-2);border-radius:var(--r-img);display:grid;place-items:center;background:var(--surface);overflow:hidden;color:var(--muted)}
.boxbtn .box img{width:100%;height:100%;object-fit:contain;padding:10%;box-sizing:border-box}
.boxbtn .box.photo img{object-fit:cover;padding:0}
.tog{width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;flex:none;padding:0}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tog.on{background:var(--accent);border-color:var(--accent)}
.tog.on i{transform:translateX(18px);background:var(--accent-ink)}
.handle{color:var(--faint);touch-action:none;padding:8px 2px 8px 8px;cursor:grab;display:grid}
.srow.dragging{background:var(--surface-2)}
.sthumb{width:40px;flex:none}
.sthumb .slot{border-radius:10px}
.sthumb .slot-plus i{width:24px;height:24px}

/* threads */
.t-cover .slot{aspect-ratio:16/10}
.t-name{margin:16px 0 4px;font:700 30px/1.1 var(--body);letter-spacing:-.022em;text-wrap:balance}
.stats{color:var(--muted);font-size:13.5px;margin:8px 0 16px;font-variant-numeric:tabular-nums}

/* archive search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;margin-bottom:12px;color:var(--muted)}
.search-in{flex:1;min-width:0;background:none;border:0;height:42px;color:var(--fg);font-size:16px}
.search-in:focus{outline:none}

/* rituals */
.rcard{display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;color:var(--fg);text-align:left;min-width:0}
.rimg{aspect-ratio:1;border-radius:var(--r-img);overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--faint);margin-bottom:6px;border:1px dashed var(--line-2)}
.rimg.has{border:0}
.rimg img{width:100%;height:100%;object-fit:cover}
.rname{font:600 15px/1.25 var(--body)}
.rsub{font-size:12px;color:var(--muted)}
.rit-name{margin:18px 0 6px;text-align:center;font:700 26px/1.15 var(--body);letter-spacing:-.02em;text-wrap:balance}
.rit-sub{text-align:center;color:var(--muted);margin:0 0 6px}
.rit-steps{list-style:none;padding:0;margin:22px 0;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.rit-steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font:400 17px/1.45 var(--body)}
.rit-steps li::before{content:counter(s);font:12px/1.9 var(--body);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.quote{font:400 18px/1.45 var(--body);margin:6px 0 0}
.sigil-sm{width:96px;aspect-ratio:1;border-radius:var(--r-img);background:var(--surface);display:grid;place-items:center;overflow:hidden}
.sigil-sm img{width:80%;height:80%;object-fit:contain}

/* oracle */
.or-img .slot{aspect-ratio:3/2}
.or-name{margin:22px 0 4px;text-align:center;font:700 24px/1.15 var(--body);letter-spacing:-.02em}
.or-kw{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 18px}
.or-text{font:400 18px/1.45 var(--body);margin:0 0 10px}
.or-q{font:500 17px/1.45 var(--body);color:var(--fg);margin:0 0 18px}
.or-pat{display:flex;flex-direction:column;gap:6px;margin:8px 0 22px;padding:14px 16px}
.or-pat p{margin:0;font-size:14px}
.fine{font-size:12px;color:var(--faint);text-align:center;margin:16px 0 0}

/* body map */
.bwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.bwrap.open{grid-template-columns:minmax(0,1fr) 150px}
.fig{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.fig .shape{fill:url(#figg);stroke:var(--line-2);stroke-width:.8}
.hs{cursor:pointer}
.hs .hit{fill:transparent}
.hs .dc{fill:var(--accent);opacity:.3;transition:opacity .2s}
.hs.obs .dc{opacity:.75}
.hs.sel .dc{opacity:1}
.hs .halo{fill:none;stroke:var(--accent);stroke-width:1;opacity:.6}
.bpanel{padding:10px 10px 12px;font-size:13px}
.bp-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:4px}
.sens{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--muted);padding:6px 2px;font-size:13px;text-align:left}
.sens i{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted);flex:none}
.sens.on{color:var(--fg)}
.sens.on i{background:var(--accent);border-color:var(--accent)}
.intens{display:flex;gap:6px;margin-top:4px}
.intens button{flex:1;height:26px;border-radius:8px;border:1px solid var(--line-2);background:none;color:var(--muted);font-size:12px;padding:0}
.intens button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sys{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}

/* sigil canvas */
.sig-cv{display:block;width:100%;max-width:100%;aspect-ratio:1;background:var(--surface);border-radius:var(--r-card);touch-action:none}
.tools{display:flex;align-items:center;gap:8px;margin:12px 0}
.tools input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}

/* onboarding */
.ob{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding-top:8vh}
.ob h1{font:600 13px var(--body);letter-spacing:.24em;text-transform:uppercase;margin:0 0 30px;color:var(--muted)}
.ob h2{font:700 32px/1.12 var(--body);letter-spacing:-.025em;margin:0 0 18px;text-wrap:balance}
.ob .grow{flex:1}
.ob .foot{display:flex;gap:10px;padding:26px 0 8px}
.ob-brand{font:700 15px var(--body)!important;letter-spacing:.28em!important;color:var(--fg)!important;margin:0 0 14px!important}
.ob-p{margin:0;color:var(--muted);font-size:17px;line-height:1.45;max-width:30ch}

/* radial */
#radial{position:fixed;inset:0;z-index:30;background:rgba(8,8,9,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;transition:opacity .25s;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12vh) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
#radial.open{opacity:1}
.rad-t{font:600 13px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0}
.rad-area{flex:1;display:grid;place-items:center;width:100%}
.rad-ring{position:relative;width:0;height:0}
.rad-b{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:1px solid var(--line-2);background:rgba(31,31,34,.94);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;padding:0;transform:translate(0,0) scale(.3);opacity:0;transition:transform .45s cubic-bezier(.2,.85,.25,1) var(--d),opacity .3s var(--d)}
#radial.open .rad-b{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
.rad-b:active{background:var(--surface-2)}
.rad-l{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rad-x{width:54px;height:54px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--fg);display:grid;place-items:center}

/* sheets & modal */
#sheet{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:80%;overflow-y:auto;background:var(--surface-2);border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;box-sizing:border-box;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between}
.sheet-t{margin:2px 0 4px;color:var(--muted);font-size:13px;text-align:center;flex:1}
.sheet-hd .sheet-t{text-align:left}
.sheet-b{width:100%;height:50px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);font-size:16px}
.sheet-b.danger{color:var(--danger)}
.sheet-b.cancel{background:none;color:var(--muted)}
.sheet-list{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);text-align:left;padding:0 4px;font-size:15px}
.pick span{flex:1}
.pick.add,.pick.muted{color:var(--muted)}
#modal{position:fixed;inset:0;z-index:50;background:var(--bg)}
.crop{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-width:520px;margin:0 auto}
.crop-hd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;text-align:center;font-weight:600}
.crop-stage{flex:1;display:grid;place-items:center;min-height:0}
.crop-frame{position:relative;width:100%;max-width:100%;max-height:100%;overflow:hidden;border-radius:var(--r-img);touch-action:none;box-shadow:0 0 0 1px var(--line-2);background:#000}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;padding-top:14px}
.crop-zoom input{flex:1;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1}
.banner{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= images ================= */
const IMG=new Map();
async function loadImages(){try{for(const [k,b] of await DB.allBlobs()){if(!String(k).endsWith('~o')&&b)IMG.set(k,URL.createObjectURL(b));}}catch(e){}}
async function putBlob(k,b){await DB.putBlob(k,b);if(!k.endsWith('~o')){const old=IMG.get(k);if(old)URL.revokeObjectURL(old);IMG.set(k,URL.createObjectURL(b));}}
function dropImage(id){if(!id)return;const u=IMG.get(id);if(u)URL.revokeObjectURL(u);IMG.delete(id);DB.delBlob(id).catch(()=>{});DB.delBlob(id+'~o').catch(()=>{});}
async function copyImage(id){const nid=uid();const b=await DB.getBlob(id);if(!b)return null;const o=await DB.getBlob(id+'~o');if(o)await putBlob(nid+'~o',o);await putBlob(nid,b);return nid;}
const imgTag=id=>{const u=id&&IMG.get(id);return u?`<img src="${u}" alt="" loading="lazy">`:''};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function toOrig(file){const url=URL.createObjectURL(file);try{const img=await loadImg(url);const max=2000;const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('encode')),'image/jpeg',.88));}finally{URL.revokeObjectURL(url);}}

let fileIn,pickCb=null;
function pickImage(ratio,cb){pickCb={ratio,cb};fileIn.value='';fileIn.click();}
async function onFile(){const f=fileIn.files&&fileIn.files[0];if(!f||!pickCb)return;const {ratio,cb}=pickCb;pickCb=null;
  try{const orig=await toOrig(f);openCropper(orig,ratio,async crop=>{const id=uid();await putBlob(id+'~o',orig);await putBlob(id,crop);await cb(id);});}
  catch(e){toast('This image could not be opened. Try a JPEG or PNG.');}}
async function recrop(id,ratio){const b=(await DB.getBlob(id+'~o'))||(await DB.getBlob(id));if(!b)return;openCropper(b,ratio,async crop=>{await putBlob(id,crop);render();});}

function openCropper(blob,ratioStr,done){
  const [rw,rh]=ratioStr.split('/').map(Number);const ratio=rw/rh;const url=URL.createObjectURL(blob);const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="crop"><div class="crop-hd"><button class="tbtn" data-c="cancel">Cancel</button><span>Crop</span><button class="tbtn strong" data-c="done">Done</button></div><div class="crop-stage"><div class="crop-frame" style="aspect-ratio:${rw}/${rh}"><img alt="" draggable="false"></div></div><label class="crop-zoom"><span>Zoom</span><input type="range" min="1" max="4" step="0.01" value="1" id="crop-z"></label></div>`;
  const frame=$('.crop-frame',m),img=$('img',m),z=$('#crop-z',m);let iw,ih,fw,fh,base,scale,tx=0,ty=0,ready=false;
  const stage=$('.crop-stage',m);
  img.onload=()=>{iw=img.naturalWidth;ih=img.naturalHeight;const sr=stage.getBoundingClientRect();let w=sr.width,h=w/ratio;if(h>sr.height){h=sr.height;w=h*ratio;}frame.style.width=w+'px';frame.style.height=h+'px';fw=w;fh=h;base=Math.max(fw/iw,fh/ih);scale=base;tx=(fw-iw*scale)/2;ty=(fh-ih*scale)/2;ready=true;apply();};
  img.src=url;
  const clamp=()=>{tx=Math.min(0,Math.max(fw-iw*scale,tx));ty=Math.min(0,Math.max(fh-ih*scale,ty));};
  const apply=()=>{clamp();img.style.width=iw*scale+'px';img.style.height=ih*scale+'px';img.style.transform=`translate(${tx}px,${ty}px)`;};
  const zoomTo=(ns,cx=fw/2,cy=fh/2)=>{ns=Math.max(base,Math.min(base*4,ns));tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;z.value=scale/base;apply();};
  z.oninput=()=>ready&&zoomTo(base*z.value);
  const pts=new Map();let lastDist=null;
  frame.onpointerdown=e=>{frame.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});};
  frame.onpointermove=e=>{if(!ready||!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){tx+=e.clientX-prev.x;ty+=e.clientY-prev.y;apply();}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastDist){const r=frame.getBoundingClientRect();zoomTo(scale*d/lastDist,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}lastDist=d;}};
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)lastDist=null;};frame.onpointerup=up;frame.onpointercancel=up;
  frame.onwheel=e=>{e.preventDefault();if(ready)zoomTo(scale*(e.deltaY<0?1.08:1/1.08));};
  const close=()=>{m.hidden=true;m.innerHTML='';m.onclick=null;URL.revokeObjectURL(url);};
  m.onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;if(b.dataset.c==='cancel'){close();return;}if(!ready)return;
    const sw=fw/scale,sh=fh/scale;const W=Math.round(Math.min(1400,sw));const c=document.createElement('canvas');c.width=W;c.height=Math.round(W/ratio);
    c.getContext('2d').drawImage(img,-tx/scale,-ty/scale,sw,sh,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));close();if(out)await done(out);};
}

/* image slot: any image container in the app */
function slot(id,ref,ratio='1/1',cls=''){const u=id&&IMG.get(id);return `<button type="button" class="slot ${u?'has':''} ${cls}" style="aspect-ratio:${ratio}" data-a="slot" data-ref="${ref}" data-ratio="${ratio}" aria-label="${u?'Change image':'Add image'}">${u?`<img src="${u}" alt="">`:`<span class="slot-plus"><i>${ico('plus',20)}</i></span>`}</button>`;}
function parseRef(s){
  const p=s.split(':');let target,persist,isDraft=false,rest;
  if(p[0]==='draft'){target=cur().params.draft;isDraft=true;persist=async()=>render();rest=p.slice(1);}
  else if(p[0]==='settings'){target=S.settings;persist=async()=>{await saveSettings();render();};rest=p.slice(1);}
  else if(p[0]==='smap'){target=S.settings[p[1]]=S.settings[p[1]]||{};persist=async()=>{await saveSettings();render();};rest=p.slice(2);}
  else{target=get(p[1]);persist=async()=>{await save(target);render();};rest=p.slice(2);}
  const [field,idx]=rest;
  return{
    get:()=>idx===undefined?target[field]:(idx==='new'?null:(target[field]||[])[+idx]),
    set:async nid=>{if(idx===undefined)target[field]=nid;else{const arr=target[field]=target[field]||[];if(idx==='new'){if(nid)arr.push(nid);}else if(nid)arr[+idx]=nid;else arr.splice(+idx,1);}
      if(isDraft&&nid)(target._new=target._new||[]).push(nid);await persist();},
    drop:id=>{if(isDraft)(target._drop=target._drop||[]).push(id);else dropImage(id);},
    coverable:idx!==undefined&&idx!=='new'&&+idx>0,
    makeCover:async()=>{const arr=target[field];const [x]=arr.splice(+idx,1);arr.unshift(x);await persist();},
  };
}
function finalizeDraft(d){(d._drop||[]).forEach(dropImage);delete d._new;delete d._drop;return d;}

/* ================= router ================= */
const R={tab:'home',stack:[]};
const cur=()=>R.stack[R.stack.length-1]||{name:R.tab,params:{}};
function go(name,params={}){R.stack.push({name,params});render();}
function back(){R.stack.pop();render();}
function tab(t){R.tab=t;R.stack=[];render();}
const V={};
function render(){
  const c=cur();const view=V[c.name]||V.home;const main=$('#main');const key=c.name+'|'+R.stack.length;const same=main.dataset.k===key;const st=main.scrollTop;
  main.innerHTML=(DB.mem?`<p class="banner">This browser window can't store data, so entries will disappear when it closes. Open the app from your Home Screen to keep them.</p>`:'')+view.html(c.params||{});
  main.dataset.k=key;main.className=view.quiet?'quiet':'';main.scrollTop=same?st:0;
  $('#nav').hidden=view.nav===false;
  $$('#nav .nb[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===R.tab));
  view.after&&view.after(c.params||{});
}

const head=(title,{back:b=false,right=''}={})=>`<header class="hd">${b?`<button class="ibtn" data-a="back" aria-label="Back">${ico('back')}</button>`:''}<h1 class="t-title">${title}</h1><div class="hd-r">${right}</div></header>`;
const edHead=(title,act,label='Save')=>`<header class="ed-hd"><button class="tbtn" data-a="cancelDraft">Cancel</button><span class="ed-t">${esc(title)}</span><button class="tbtn strong" data-a="${act}">${label}</button></header>`;
const rowBtn=(icon,label,val,act,extra='')=>`<button class="row" data-a="${act}" ${extra}><span class="row-i">${ico(icon,18)}</span><span class="row-m">${label}</span><span class="row-v">${esc(val)}</span>${ico('chev',16)}</button>`;
const stChip=s=>`<span class="chip"><i class="dot" style="--c:${s.color}"></i>${esc(s.name)}</span>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}
function closeSheet(){const m=$('#sheet');m.hidden=true;m.innerHTML='';m.onclick=null;}
function sheet(opts,title){const m=$('#sheet');m.hidden=false;m.innerHTML=`<div class="sheet-bg" data-s="x"></div><div class="sheet" role="dialog">${title?`<p class="sheet-t">${esc(title)}</p>`:''}${opts.map((o,i)=>`<button class="sheet-b ${o.danger?'danger':''}" data-s="${i}">${esc(o.label)}</button>`).join('')}<button class="sheet-b cancel" data-s="x">Cancel</button></div>`;
  m.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;closeSheet();if(b.dataset.s!=='x')opts[+b.dataset.s].fn();};}
const confirmSheet=(title,label,fn)=>sheet([{label,danger:true,fn}],title);
function pickSheet(title,items,sel,multi,done,extra){const set=new Set((sel||[]).filter(Boolean));const m=$('#sheet');
  const draw=()=>{m.innerHTML=`<div class="sheet-bg" data-s="x"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-hd"><p class="sheet-t">${esc(title)}</p>${multi?`<button class="tbtn strong" data-s="done">Done</button>`:''}</div><div class="sheet-list">${items.length?items.map(it=>`<button class="pick" data-s="i" data-id="${it.id}">${it.color?`<i class="dot" style="--c:${it.color}"></i>`:''}<span>${esc(it.label)}</span>${set.has(it.id)?ico('check',18):''}</button>`).join(''):`<p class="empty" style="padding:10px 4px">Nothing here yet.</p>`}${extra?`<button class="pick add" data-s="extra">${ico('plus',16)}<span>${esc(extra.label)}</span></button>`:''}${!multi&&set.size?`<button class="pick muted" data-s="none"><span>Remove link</span></button>`:''}</div></div>`;};
  draw();m.hidden=false;
  m.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
    if(s==='x'){closeSheet();if(multi)done([...set]);return;}
    if(s==='done'){closeSheet();done([...set]);return;}
    if(s==='none'){closeSheet();done([]);return;}
    if(s==='extra'){closeSheet();extra.fn();return;}
    const id=b.dataset.id;if(multi){set.has(id)?set.delete(id):set.add(id);draw();}else{closeSheet();done([id]);}};}
function inputSheet(title,val,done,{ph='',btn='Save',multiline=false}={}){const m=$('#sheet');m.hidden=false;
  m.innerHTML=`<div class="sheet-bg" data-s="x"></div><form class="sheet" id="in-form"><p class="sheet-t">${esc(title)}</p>${multiline?`<textarea class="field area" id="in-v" placeholder="${esc(ph)}">${esc(val||'')}</textarea>`:`<input class="field" id="in-v" value="${esc(val||'')}" placeholder="${esc(ph)}" autocomplete="off" enterkeyhint="done">`}<button class="btn" type="submit">${esc(btn)}</button><button class="sheet-b cancel" type="button" data-s="x">Cancel</button></form>`;
  const inp=$('#in-v');try{inp.focus();}catch(e){}
  m.onclick=e=>{if(e.target.closest('[data-s="x"]'))closeSheet();};
  $('#in-form').onsubmit=e=>{e.preventDefault();const v=$('#in-v').value.trim();closeSheet();if(v||multiline)done(v);};}

/* moon */
function moonPhase(d=new Date()){const syn=29.530588853;const ref=Date.UTC(2000,0,6,18,14);return((((d-ref)/DAY)%syn)+syn)%syn/syn;}
function moonName(){const p=moonPhase();return['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'][Math.floor(p*8+.5)%8];}
function moonSVG(){const p=moonPhase(),r=7,cx=8,cy=8,k=Math.cos(p*2*Math.PI),wax=p<.5,rx=(Math.abs(k)*r).toFixed(2);
  const outer=`M${cx} ${cy-r} A${r} ${r} 0 0 ${wax?1:0} ${cx} ${cy+r}`;const inner=wax?(k>0?0:1):(k>0?1:0);
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5"/><path d="${outer} A${rx} ${r} 0 0 ${inner} ${cx} ${cy-r}Z" fill="currentColor"/></svg>`;}

/* ================= entry helpers ================= */
function entryLabel(e){
  if(e.kind==='body'){const b=e.body||{};return b.sensation?`${b.sensation}${b.region?` (${b.region.toLowerCase()})`:''}`:(b.region||'Body observation');}
  const t=(e.text||'').trim();if(t)return t.split('\n')[0].slice(0,140);
  if(e.kind==='ritual'&&get(e.ritualId))return get(e.ritualId).name;
  if(e.kind==='state')return(e.stateIds||[]).map(get).filter(Boolean).map(s=>s.name).join(', ')||'State';
  if(e.kind==='sign'&&get(e.intentionId))return'A sign for '+get(e.intentionId).title;
  const c=(e.categoryIds||[]).map(get).filter(Boolean)[0];if(c)return c.name;
  return(KINDS[e.kind]||KINDS.note).label;}
function entryColor(e){const s=(e.stateIds||[]).map(get).find(Boolean);if(s)return s.color;const c=(e.categoryIds||[]).map(get).find(Boolean);if(c)return c.color;return(KINDS[e.kind]||KINDS.note).color;}
const kindTag=e=>e.kind==='note'||e.kind==='photo'?'':(KINDS[e.kind]||{}).label||'';
function tile(e,cap){const ph=(e.photoIds||[]).map(id=>IMG.get(id)).find(Boolean);const k=KINDS[e.kind]||KINDS.note;
  return `<div class="tw"><button class="tile" data-a="go" data-to="entry" data-p="${jp({id:e.id})}">${ph?`<img src="${ph}" alt="">`:`<span class="tile-t">${esc(entryLabel(e))}</span><span class="tile-k" style="--c:${entryColor(e)}">${ico(k.icon,14)}</span>`}</button>${cap?`<p class="cap">${cap}</p>`:''}</div>`;}
const lineRow=(e,showDate)=>`<button class="line" data-a="go" data-to="entry" data-p="${jp({id:e.id})}"><i class="dot" style="--c:${entryColor(e)}"></i><span class="line-t">${esc(entryLabel(e))}</span><span class="line-k">${esc(kindTag(e))}</span><time>${showDate?fmt.short(e.date)+' · ':''}${fmt.time(e.date)}</time></button>`;
const threadCount=id=>all('entry').filter(e=>(e.threadIds||[]).includes(id)).length;
function threadsByRelevance(){const last=new Map();all('entry').forEach(e=>(e.threadIds||[]).forEach(t=>{if((last.get(t)||0)<e.date)last.set(t,e.date);}));return all('thread').sort((a,b)=>(last.get(b.id)||b.createdAt||0)-(last.get(a.id)||a.createdAt||0));}
const threadRow=t=>{const n=threadCount(t.id);return `<button class="row" data-a="go" data-to="thread" data-p="${jp({id:t.id})}"><span class="thumb">${imgTag(t.coverId)||`<i style="--c:${t.color}">${ico(t.icon||'threads',20)}</i>`}</span><span class="row-m"><span class="row-t">${esc(t.name)}</span>${t.description?`<span class="row-s">${esc(t.description)}</span>`:''}<span class="row-s">${plural(n,'entry','entries')}</span></span>${ico('chev',18)}</button>`;};
function todayStates(){const k=dkey(Date.now());const set=new Set();all('entry').forEach(e=>{if(e.kind==='state'&&dkey(e.date)===k)(e.stateIds||[]).forEach(s=>set.add(s));});return set;}
function newEntryDraft(kind,extra={}){return Object.assign({id:uid(),type:'entry',kind,text:'',date:Date.now(),photoIds:[],categoryIds:[],stateIds:[],threadIds:[],tags:'',location:'',ritualId:null,intentionId:null},extra);}
function radialIcon(r){if(r.action.startsWith('cat:')){const c=get(r.action.slice(4));return c?c.icon:'sign';}return(RADIAL_TYPES.find(t=>t.action===r.action)||{}).icon||'sign';}

const MS={mode:'timeline',filter:'all',ym:null,sel:null};
function filterList(){const f=[{k:'all',l:'All'},{k:'photos',l:'Photos'},{k:'states',l:'States'},{k:'kind:body',l:'Body'},{k:'kind:mind',l:'Mind'},{k:'kind:ritual',l:'Ritual'},{k:'intentions',l:'Intentions'},{k:'kind:sign',l:'Signs'},{k:'kind:dream',l:'Dreams'},{k:'kind:note',l:'Notes'}];
  ordered('category').forEach(c=>f.push({k:'cat:'+c.id,l:c.name,c:c.color}));threadsByRelevance().forEach(t=>f.push({k:'th:'+t.id,l:t.name,c:t.color}));return f;}
function match(e,f){if(f==='all')return true;if(f==='photos')return(e.photoIds||[]).some(id=>IMG.get(id));if(f==='states')return(e.stateIds||[]).length>0;if(f==='intentions')return e.kind==='intention'||e.kind==='sign'||!!e.intentionId;
  const [t,v]=f.split(':');if(t==='kind')return e.kind===v;if(t==='cat')return(e.categoryIds||[]).includes(v);if(t==='th')return(e.threadIds||[]).includes(v);return true;}
V.map={html(){
  const fl=filterList();if(!fl.some(x=>x.k===MS.filter))MS.filter='all';
  const es=entries().filter(e=>match(e,MS.filter));
  const chips=`<div class="chips scroll">${fl.map(x=>`<button class="chip ${MS.filter===x.k?'on':''}" data-a="mapFilter" data-f="${x.k}">${x.c?`<i class="dot" style="--c:${x.c}"></i>`:''}${esc(x.l)}</button>`).join('')}</div>`;
  const top=head('Map',{right:`<button class="ibtn" data-a="searchAll" aria-label="Search">${ico('search')}</button>`})+`<div class="seg" role="tablist"><button class="${MS.mode==='timeline'?'on':''}" data-a="mapMode" data-m="timeline">Timeline</button><button class="${MS.mode==='calendar'?'on':''}" data-a="mapMode" data-m="calendar">Calendar</button></div>`+chips;
  return top+(MS.mode==='calendar'?calendarHTML(es):timelineHTML(es));}};
function timelineHTML(es){
  if(!es.length)return MS.filter==='all'?`<button class="empty-cta" data-a="radial">Your map is empty. Each entry you add appears here under its date. Tap + to add the first one.</button>`:`<p class="empty">Nothing here yet for this filter.</p>`;
  const groups=new Map();es.forEach(e=>{const k=dkey(e.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e);});
  let h='',lastM='';
  for(const [,g] of groups){const m=fmt.month(g[0].date);if(m!==lastM){h+=`<h2 class="mon">${m}</h2>`;lastM=m;}
    const photos=g.flatMap(e=>(e.photoIds||[]).filter(id=>IMG.get(id)).map(id=>({e,id})));
    const states=[...new Set(g.flatMap(e=>e.stateIds||[]))].map(get).filter(Boolean);
    const lines=g.filter(e=>!(e.kind==='state'&&!(e.text||'').trim()&&!(e.photoIds||[]).length));
    h+=`<section class="day"><h3 class="day-t">${fmt.day(g[0].date)}</h3>${states.length?`<div class="chips sm">${states.map(stChip).join('')}</div>`:''}${photos.length?`<div class="grid3">${photos.map(p=>`<button class="tile" data-a="go" data-to="entry" data-p="${jp({id:p.e.id})}"><img src="${IMG.get(p.id)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}${lines.length?`<div class="lines">${lines.map(e=>lineRow(e)).join('')}</div>`:''}</section>`;}
  return h;}
function calendarHTML(es){
  const now=new Date();const base=MS.ym?new Date(MS.ym+'-01T12:00:00'):now;const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells=Math.ceil((off+dim)/7)*7;
  const by=new Map();es.forEach(e=>{const k=dkey(e.date);if(!by.has(k))by.set(k,[]);by.get(k).push(e);});
  const sel=MS.sel||dkey(now);const tk=dkey(now);
  let g=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="wd">${d}</span>`).join('');
  for(let i=0;i<cells;i++){const d=new Date(y,m,1-off+i);const k=dkey(d);const de=by.get(k)||[];
    let cols=[...new Set(de.flatMap(e=>(e.stateIds||[]).map(get).filter(Boolean).map(s=>s.color)))];if(!cols.length)cols=[...new Set(de.map(entryColor))];
    g+=`<button class="cd ${d.getMonth()!==m?'out':''} ${k===tk?'today':''} ${k===sel?'sel':''}" data-a="calDay" data-k="${k}" aria-label="${fmt.dayLong(d)}${de.length?', '+plural(de.length,'entry','entries'):''}"><span class="n">${d.getDate()}</span><span class="dots">${cols.slice(0,4).map(c=>`<i style="--c:${c}"></i>`).join('')}</span></button>`;}
  const day=(by.get(sel)||[]).slice().sort((a,b)=>b.date-a.date);const sd=new Date(sel+'T12:00:00');
  return `<div class="cal-h"><button class="ibtn" data-a="calMonth" data-d="-1" aria-label="Previous month">${ico('back',20)}</button><h2>${fmt.month(first)}</h2><button class="ibtn" data-a="calMonth" data-d="1" aria-label="Next month">${ico('chev',20)}</button></div>
  <div class="cal">${g}</div>
  <div class="cal-day"><div class="sec-h"><h2 class="sec-t">${fmt.day(sd)}</h2><button class="ibtn ring sm" data-a="newOnDay" data-k="${sel}" aria-label="Add an entry on this day">${ico('plus',16)}</button></div>${day.length?`<div class="lines">${day.map(e=>lineRow(e)).join('')}</div>`:`<p class="empty">Nothing recorded on this day.</p>`}</div>`;}

V.sigil={nav:false,html(p){
  if(p.id&&!p.draft){const s=get(p.id);if(!s)return head('Not found',{back:true});p.draft=clone(s);}
  const d=p.draft;const isNew=!S.items.has(d.id);
  return `${edHead(isNew?'New sigil':'Sigil','saveSigil')}

  <div class="list card">
   ${rowBtn('intention','Intention',get(d.intentionId)?.title||'None','pickOne','data-f="intentionId" data-type="intention" data-title="Attach to an intention"')}
   ${rowBtn('ritual','Ritual',get(d.ritualId)?.name||'None','pickOne','data-f="ritualId" data-type="ritual" data-title="Attach to a ritual"')}
   ${rowBtn('threads','Thread',get(d.threadId)?.name||'None','pickOne','data-f="threadId" data-type="thread" data-title="Attach to a thread"')}
  </div>
  ${isNew?'':`<button class="danger-link" data-a="delSigil" data-id="${d.id}">Delete sigil</button>`}`;},
  after(p){const cv=$('#sig-cv');const d=p.draft;const dpr=Math.min(2,window.devicePixelRatio||1);const size=Math.max(200,Math.round(cv.getBoundingClientRect().width));
    cv.width=size*dpr;cv.height=size*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    const restore=src=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(src,0,0,cv.width,cv.height);ctx.restore();};
    if(SG.buf&&SG.buf._for===d.id)restore(SG.buf);else{SG.hist=[];SG.buf=null;if(d.imageId&&IMG.get(d.imageId))loadImg(IMG.get(d.imageId)).then(i=>{restore(i);snap();});}
    function snap(){const b=document.createElement('canvas');b.width=cv.width;b.height=cv.height;b.getContext('2d').drawImage(cv,0,0);b._for=d.id;SG.buf=b;}
    SG.cv=cv;SG.restore=restore;SG.snap=snap;
    let drawing=false,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*size/r.width,y:(e.clientY-r.top)*size/r.height};};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);if(SG.buf){SG.hist.push(SG.buf);if(SG.hist.length>25)SG.hist.shift();}else SG.hist.push(null);drawing=true;last=pt(e);stroke(last,last);};
    cv.onpointermove=e=>{if(!drawing)return;const p2=pt(e);stroke(last,p2);last=p2;};
    const end=()=>{if(!drawing)return;drawing=false;snap();d._dirty=true;};cv.onpointerup=end;cv.onpointercancel=end;
    function stroke(a,b){ctx.globalCompositeOperation=SG.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle='#f2f2f3';ctx.lineWidth=SG.tool==='eraser'?SG.size*2.5:SG.size;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x+.01,b.y);ctx.stroke();}
    $('#sg-size').oninput=e=>{SG.size=+e.target.value;};
  }};

function oracleReading(){
  const es=entries().filter(e=>e.date>=Date.now()-14*DAY);const pattern=[];let key;
  const stc=new Map();es.forEach(e=>(e.stateIds||[]).forEach(id=>{if(get(id))stc.set(id,(stc.get(id)||0)+1);}));const top=[...stc].sort((a,b)=>b[1]-a[1]);const totalSt=[...stc.values()].reduce((a,b)=>a+b,0);
  const body=es.filter(e=>e.kind==='body'&&e.body);const sens=new Map();body.forEach(e=>{const k=`${e.body.sensation||'A sensation'}|${e.body.region||''}`;sens.set(k,(sens.get(k)||0)+1);});const topSens=[...sens].sort((a,b)=>b[1]-a[1])[0];
  const tension=body.filter(e=>/tension|pain|tight|pressure|ache/i.test(e.body.sensation||'')).length;
  if(es.length<3)key='fool';
  else if(tension>=3&&tension>=(top[0]?.[1]||0))key='tower';
  else if(top.length>=4&&top[0][1]/totalSt<.35)key='wheel';
  else if(top.length)key=STATE_ARCH[get(top[0][0]).name.trim().toLowerCase()]||'wheel';
  else if(es.some(e=>e.kind==='sign'||e.intentionId))key='star';
  else key='temperance';
  if(top.length){const [id,n]=top[0];const s=get(id);pattern.push(`You have recorded ${s.name.toLowerCase()} ${times(n)} in the last 14 days.`);
    const days=new Set(es.filter(e=>(e.stateIds||[]).includes(id)).map(e=>dkey(e.date)));
    if(days.size>=2){const cc=new Map();es.forEach(e=>(e.categoryIds||[]).forEach(c=>{if(!get(c))return;const k=dkey(e.date);if(days.has(k)){if(!cc.has(c))cc.set(c,new Set());cc.get(c).add(k);}}));
      const best=[...cc].sort((a,b)=>b[1].size-a[1].size)[0];if(best&&best[1].size>=2)pattern.push(`On ${best[1].size} of the ${days.size} days you felt ${s.name.toLowerCase()}, you also recorded ${get(best[0]).name}.`);}}
  if(topSens&&topSens[1]>=2){const [sn,rg]=topSens[0].split('|');pattern.push(`${sn}${rg?` in your ${rg.toLowerCase()}`:''} appeared ${times(topSens[1])}.`);}
  if(!pattern.length)pattern.push(es.length?`You have made ${plural(es.length,'entry','entries')} in the last 14 days.`:'Nothing has been recorded in the last 14 days.');
  const a=ARCH[key];const rs=ordered('ritual');const rit=rs.find(r=>a.rit.some(k=>`${r.name} ${r.purpose||''} ${r.group||''}`.toLowerCase().includes(k)))||rs[0]||null;
  return{key,name:a.name,kw:a.kw,text:a.text,q:a.q,pattern,ritualId:rit?rit.id:null};}
function readingHTML(o,{saved}){const r=get(o.ritualId);return `
  <div class="or-img">${slot((S.settings.oracleImages||{})[o.key],`smap:oracleImages:${o.key}`,'3/2')}</div>
  <h2 class="or-name">${esc(o.name)}</h2><p class="or-kw">${esc(o.kw)}</p>
  <p class="eyebrow">Your current pattern</p><div class="card or-pat">${o.pattern.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <p class="or-text">${esc(o.text)}</p><p class="or-q">${esc(o.q)}</p>
  ${r?`<p class="eyebrow">Suggested ritual</p><div class="list card" style="margin:8px 0 18px"><button class="row" data-a="go" data-to="ritual" data-p="${jp({id:r.id})}"><span class="thumb" style="width:48px;height:48px">${imgTag(r.imageId)||`<i style="--c:var(--muted)">${ico('candle',20)}</i>`}</span><span class="row-m"><span class="row-t">${esc(r.name)}</span><span class="row-s">${esc([r.duration,r.purpose].filter(Boolean).join(' · '))}</span></span>${ico('chev',16)}</button></div>`:''}
  ${saved}<p class="fine">Drawn only from what you recorded on this device. A reflection, not a prediction or a diagnosis.</p>`;}
V.oracle={nav:false,quiet:true,html(){const o=oracleReading();const done=all('oracle').find(x=>dkey(x.date)===dkey(Date.now())&&x.key===o.key);
  return `${head('Your Oracle for Today',{back:true})}${readingHTML(o,{saved:`<button class="btn" data-a="oracleSave" ${done?'disabled':''}>${done?'Saved to today':'Save to today'}</button>`})}`;}};
V.reading={quiet:true,html({id}){const o=get(id);if(!o)return head('Not found',{back:true});return `${head(fmt.day(o.date),{back:true})}${readingHTML(o,{saved:''})}<button class="danger-link" data-a="delReading" data-id="${id}">Delete reading</button>`;}};

/* sortable lists */
function bindSortables(){$$('.sortable').forEach(list=>{if(list._s)return;list._s=1;
  list.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;const row=h.closest('.srow');e.preventDefault();row.classList.add('dragging');
    const move=ev=>{ev.preventDefault();const y=ev.clientY;for(const r of $$('.srow',list)){if(r===row)continue;const b=r.getBoundingClientRect();if(y>b.top&&y<b.bottom){if(y<b.top+b.height/2)list.insertBefore(row,r);else list.insertBefore(row,r.nextSibling);break;}}};
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);row.classList.remove('dragging');reorder(list.dataset.sort,$$('.srow',list).map(r=>r.dataset.id));};
    window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});});}
async function reorder(kind,ids){
  if(kind==='home'||kind==='radial'){const key=kind==='home'?'type':'id';const arr=S.settings[kind];arr.sort((a,b)=>ids.indexOf(a[key])-ids.indexOf(b[key]));await saveSettings();return;}
  for(let i=0;i<ids.length;i++){const x=get(ids[i]);if(x&&x.order!==i){x.order=i;await save(x);}}}

async function seed(catNames){const now=Date.now();const items=[];let o=0;const mk=(type,x)=>{const it=Object.assign({id:uid(),type,createdAt:now+(o++),imageId:null},x);items.push(it);return it;};
  catNames.forEach((n,i)=>{const d=CAT_DEF[n];mk('category',{name:n,color:d?d[0]:PALETTE[i%PALETTE.length],icon:d?d[1]:'sign',order:i});});
  [['Calm','#9fb7a8','Settled, unhurried.'],['Restless','#d9826b','Can’t quite land anywhere.'],['Heavy','#8a8fb0','Slow, weighted.'],['Creative','#d8b56a','Ideas want out.'],['Magnetic','#c46b8f','Drawing things toward me.'],['Grounded','#a68a6d','Feet on the floor.']].forEach(([n,c,ds],i)=>mk('state',{name:n,color:c,icon:'state',description:ds,order:i}));
  [['My Body','Observations · Patterns · Care','#c98d7c','body'],['Becoming Her','Intentions · Actions · Identity','#d6b46a','sign'],['Manifestation','Desires · Rituals · Signs','#b49ccc','intention'],['Beauty','Self-care · Aesthetics · Style','#d39aa8','flower'],['My Home','Space · Comfort · Environment','#b59a7a','home']].forEach(([n,ds,c,ic])=>mk('thread',{name:n,description:ds,color:c,icon:ic,coverId:null}));
  const R=[['The Cleansing Rite','Cleansing','Release & reset','10–15 min',['Take a warm shower.','Wash slowly, one part of the body at a time.','Imagine the day leaving the body with the water.','Put on clean clothes.','Sit quietly for five minutes.']],
    ['Grounding','Grounding','Reconnect','5 min',['Stand or sit with both feet on the floor.','Name five things you can see.','Breathe out for longer than you breathe in, ten times.','Press your palms together and notice the warmth.']],
    ['Protection','Protection','Energetic boundaries','3–5 min',['Stand by your door or your bed.','Say out loud what you will not carry into this space.','Draw a line in the air with your hand, or close the door slowly.','Light a candle if you like, and let it mark the boundary.']],
    ['Night Reset','Rest','Close the day','15 min',['Dim the lights and put your phone face down.','Clear one surface in the room.','Write three lines about today.','Drink a glass of water.','Lie down and let the day be finished.']],
    ['Beauty Ritual','Beauty','Self-love','10 min',['Wash your face with warm water.','Apply your skincare slowly, with your hands.','Look at yourself without correcting anything.','Choose one thing you like and say it.']]];
  R.forEach(([n,g,p,du,st],i)=>mk('ritual',{name:n,group:g,purpose:p,duration:du,steps:st,sample:true,order:i,threadId:null,intentionId:null,sigilId:null}));
  const I=[['More freedom','I want more freedom.','I am building a life where I can move freely.'],['More presence','I want to be here, not somewhere in my head.','I return to my body and to the room I am in.'],['More confidence','I want to trust myself more.','I act before I feel completely ready.']];
  const ints=I.map(([t,de,st])=>mk('intention',{sample:true,title:t,desire:de,statement:st,actions:[],signsToNotice:[],reflection:'',threadId:null,ritualId:null,sigilId:null}));
  S.settings.currentIntentionId=ints[0].id;
  for(const it of items){S.items.set(it.id,it);}await Promise.all(items.map(it=>DB.put(it).catch(()=>{})));await saveSettings();}

/* ================= backup ================= */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(/data:([^;]+)/.exec(h)||[])[1]||'application/octet-stream';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
async function exportData(){toast('Preparing backup…');try{const blobs={};for(const [k,b] of await DB.allBlobs())if(b)blobs[k]=await blobToDataURL(b);
  const json=JSON.stringify({app:'body-oracle',version:1,exportedAt:Date.now(),settings:S.settings,items:[...S.items.values()],blobs});
  const name=`body-oracle-backup-${dkey(Date.now())}.json`;const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Body Oracle backup'});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  catch(e){toast('Export did not work in this window. Open the app from your Home Screen and try again.');}}
async function importData(f){if(!f)return;let data;try{data=JSON.parse(await f.text());if(data.app!=='body-oracle'||!Array.isArray(data.items))throw 0;}catch(e){toast('That file is not a Body Oracle backup.');return;}
  confirmSheet(`Restore ${plural(data.items.filter(x=>x.type==='entry').length,'entry','entries')} from this backup? What is here now will be replaced.`,'Restore backup',async()=>{
    await DB.clear();IMG.forEach(u=>URL.revokeObjectURL(u));IMG.clear();S.items.clear();
    for(const x of data.items){S.items.set(x.id,x);await DB.put(x);}S.settings=Object.assign(defaultSettings(),{v:1},data.settings||{});migrateSettings(S.settings);await saveSettings();
    for(const [k,u] of Object.entries(data.blobs||{}))await putBlob(k,dataURLToBlob(u));applyTheme();R.stack=[];R.tab='home';render();toast('Backup restored');});}

/* ================= theme & boot ================= */
/* v2 redesign: Home and + menu start from the simpler layout; entries, images and lists are untouched. */
function migrateSettings(s){const d=defaultSettings();for(const k in d)if(s[k]===undefined)s[k]=d[k];
  if((s.v||1)<2){s.home=d.home;s.radial=d.radial;s.v=2;saveSettings();}
  const have=new Set(s.home.map(m=>m.type));HOME_DEFAULT.forEach(t=>{if(!have.has(t))s.home.push({type:t,on:false});});}
function applyTheme(){const s=S.settings,r=document.documentElement;r.style.setProperty('--accent',s.accent);r.style.setProperty('--accent-ink',lum(s.accent)>.42?'#0b0b0c':'#fbfbfb');r.dataset.cards=s.cards;r.dataset.corners=s.corners;}
function buildNav(){$('#nav').innerHTML=[['home','Home','home'],['map','Map','map'],null,['threads','Threads','threads'],['archive','Archive','archive'],['settings','Settings','settings']].map(x=>x?`<button class="nb" data-a="tab" data-t="${x[0]}">${ico(x[2],22)}<span>${x[1]}</span></button>`:`<button class="nb plus" data-a="radial" aria-label="Add"><span class="pc">${ico('plus',26)}</span></button>`).join('');}
async function init(){
  buildNav();fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.hidden=true;fileIn.addEventListener('change',onFile);document.body.append(fileIn);
  document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e);}});
  document.addEventListener('input',e=>{const el=e.target;
    if(el.dataset.bind){const d=draft();if(!d)return;let v=el.value;if(el.type==='datetime-local'){const n=new Date(v).getTime();if(isNaN(n))return;v=n;}setPath(d,el.dataset.bind,v);if(el.dataset.bind==='color')$$('.sw').forEach(s=>s.classList.remove('on'));}
    else if(el.dataset.sbind){S.settings[el.dataset.sbind]=el.value;saveSettingsSoon();}
    else if(el.dataset.scolor){S.settings[el.dataset.scolor]=el.value;applyTheme();saveSettingsSoon();}
    else if(el.id==='arch-q'){AS.q=el.value;$('#arch-res').innerHTML=archResults();}});
  document.addEventListener('change',e=>{if(e.target.id==='import-file'){importData(e.target.files[0]);e.target.value='';}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(!$('#radial').hidden)closeRadial();}});
  await DB.open();
  try{const items=await DB.all();items.forEach(x=>S.items.set(x.id,x));}catch(e){}
  S.settings=S.items.get('settings')||null;S.items.delete('settings');await loadImages();
  if(!S.settings){S.settings=defaultSettings();R.stack=[{name:'onboard',params:{step:1,cats:[]}}];}
  else migrateSettings(S.settings);
  applyTheme();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  if(window.BO_PWA&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
